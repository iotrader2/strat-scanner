# Theme map: the source of truth for the Themes page, the scanner's Theme filter and the Theme strength score.
#
# - `members`: PRIMARY members. A stock is the primary member of at most one theme. They define the theme's equal-weight
#   index, and the stock's Theme strength comes from this theme's rank.
# - `also`: optional SECONDARY members: shown (dimmed) on the card and matched by the scanner's theme filter, but not part
#   of the index and not used for scoring.
# - `keep`: primary members that the correlation report flags but that were reviewed and deliberately kept (usually names
#   the user asked for by hand). The report still lists them, marked as kept.
# - Tickers are written as one space-separated string (YAML would read bare ON/NO as booleans). Class shares use a dash
#   (BRK-B).
# - Tickers outside the S&P 500 / Nasdaq-100 are added to the universe by `npm run themes:sync` when they pass the liquidity
#   gate; names that fail it are removed from this file, and names no theme lists any more are pruned from the universe.
# - Tune this file with `npm run themes:report` (rolling 6-month correlation of daily returns, beta-adjusted vs SPY,
#   clustering, flagged members). The report only suggests; the map below always wins.
#
# Bump `version` whenever the membership changes.
